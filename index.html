/* ============ SAVE / SHARE CARD IMAGE ============ */
/* The card displays shrunk in-app (zoom on .rcard-zoomwrap) so everything fits the
   screen without scrolling. For export, we temporarily remove that zoom so
   html2canvas always captures the card at its full native size — IG Story-ready —
   regardless of how small it currently appears on screen. */
function renderCardToCanvas(callback){
  var wrap = document.querySelector(".rcard-zoomwrap");
  var node = document.getElementById("shareCard");
  var prevZoom = wrap.style.zoom;
  wrap.style.zoom = "1";
  html2canvas(node, {backgroundColor:null, scale:3.2}).then(function(cardCanvas){
    wrap.style.zoom = prevZoom || "";

    /* Compose onto a fixed 1080x1920 canvas (Instagram Story size) so the
       exported image always fits the story frame exactly, regardless of the
       card's own natural aspect ratio. The card is scaled to fit the full
       height with no cropping; any leftover width is filled with the
       character's own panel color so it reads as an intentional edge, not
       empty padding. */
    var IG_W = 1080, IG_H = 1920;
    var out = document.createElement('canvas');
    out.width = IG_W; out.height = IG_H;
    var ctx = out.getContext('2d');
    var fillColor = (S.res && A[S.res.style]) ? A[S.res.style].dk : "#111111";
    ctx.fillStyle = fillColor;
    ctx.fillRect(0, 0, IG_W, IG_H);

    var scale = IG_H / cardCanvas.height;
    var drawW = cardCanvas.width * scale;
    var offsetX = (IG_W - drawW) / 2;
    ctx.drawImage(cardCanvas, offsetX, 0, drawW, IG_H);

    callback(out);
  }).catch(function(err){
    wrap.style.zoom = prevZoom || "";
    console.log("Card render failed", err);
  });
}
function saveCardImage(){
  renderCardToCanvas(function(canvas){
    canvas.toBlob(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "tech-innovator-card.png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  });
}
function shareCardImage(){
  renderCardToCanvas(function(canvas){
    canvas.toBlob(function(blob){
      var file = new File([blob], "tech-innovator-card.png", {type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:"What kind of tech innovator are you?",
          text:"I'm " + D[S.res.key].t[0] + " — what's your type?"}).catch(function(){});
      }else{
        saveCardImage();
      }
    });
  });
}

    if(S.a3>0){S.a3--;} else {S.ph="result";}
  }else if(S.ph==="result"){
    S.ph="flow"; S.i=FLOW.length-1;
  }else if(S.ph==="done"){
    S.ph="result";
  }
  render();
}
function startQuiz(){ S.ph="flow"; S.langLocked=true; S.rid=makeResponseId(); render(); }
function toggleLang(){ if(S.langLocked) return; S.lang=S.lang?0:1; render(); }
function restart(){
  S={ph:"cover",i:0,a3:0,lang:S.lang,langLocked:false,selected:{},selectedA3:{},otherText:{},res:null,rid:null};
  render();
}

function chromeHtml(dotsTotal, dotsCur){
  var d="";
  if(dotsTotal){for(var i=0;i<dotsTotal;i++){d+='<div class="dot'+(i===dotsCur?' active':'')+'" style="width:'+(i===dotsCur?"16px":"6px")+';"></div>';}}
  return '<div class="chrome">'
    +'<button class="navbtn" onclick="back()">&#8592;</button>'
    +'<div class="dots">'+d+'</div>'
    +'<div style="width:30px;"></div>'
    +'</div>';
}
function topbarHtml(){
  return '<div class="topbar" style="flex-direction:column;align-items:flex-start;gap:5px;">'
    +'<div style="display:flex;align-items:flex-end;gap:7px;"><img class="logo" src="'+LOGO+'"><div class="rd" style="text-shadow:none;">R&amp;D</div></div>'
    +'<div class="cardcaption">'+(S.lang?"ติดตามความรู้ใหม่ ๆ ผ่าน LINE @scbxrd":"Stay tech-updated via LINE @scbxrd")+'</div>'
    +'</div>';
}

function render(){
  var stage=document.getElementById("stage"), h="";

  if(S.ph==="cover"){
    h='<div class="screen cover">'
      +'<div class="cover-scrim"></div>'
      +'<div class="topbar">'
      +'<img class="logo" src="'+LOGO+'"><div class="rd">R&amp;D</div>'
      +'<button class="langtoggle" onclick="toggleLang()">'+(S.lang?"EN":"TH")+'</button></div>'
      +'<div class="cover-content">';
    if(S.lang){
      h+='<div class="cover-title">คุณเป็นผู้สร้าง<span class="accent">นวัตกรรมทางเทคโนโลยี</span>แบบไหน?</div>'
        +'<div class="cover-desc">เทคโนโลยีใหม่เข้าสู่วาระการประชุมทุกเดือน บางคนพร้อมลงมือทันที บางคนตั้งคำถามอย่างจริงจัง และบางคนอยากรู้เพียงแค่ R&amp;D เท่านั้น ใช้เวลาเพียง 2 นาที มาดูกันว่าคุณเป็นคนแบบไหน</div>';
    }else{
      h+='<div class="cover-title">What kind of <span class="accent">Tech Innovator</span> are you?</div>'
        +'<div class="cover-desc">New tech lands on the agenda every month. Some people dive in, some push back, some just want the R&amp;D. Take 2 minutes to find out which one you are.</div>';
    }
    h+='<button class="cover-cta" onclick="startQuiz()"><span>'+(S.lang?"เริ่มทำแบบทดสอบ":"Start the quiz")+'</span>'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>'
      +'</div></div>';

  }else if(S.ph==="flow"){
    var step=FLOW[S.i];
    if(step.info){
      var dimOpacity = step.eyeflash ? .93 : .58;
      h='<div class="screen transition-screen">'
        +'<div class="transition-dim" style="background:rgba(4,3,8,'+dimOpacity+');"></div>'
        +chromeHtml(FLOW.length, S.i)
        +'<div class="transition-mid">';
      if(step.eyeflash){
        h+='<div class="eyewrap"><div class="breathcircle"></div></div>';
      }
      h+='<div class="infotext">'+T(step.ti)+'</div>'
        +'<button class="transition-btn" onclick="advInfo()">'+T(step.btn)+'</button>'
        +'</div></div>';
    }else{
      h='<div class="screen app">'+chromeHtml(FLOW.length, S.i);
      if(step.sub){h+='<div class="qlabel">'+T(step.sub)+'</div>';}
      h+='<div class="qtext">'+T(step.q)+'</div>';
      var sel=S.selected[S.i];
      var otherIdx = step.hasOther ? step.o.length-1 : -1;
      for(var i=0;i<step.o.length;i++){
        var opt=step.o[i], isSel=(sel===i);
        if(i===otherIdx && isSel){
          var curVal = S.otherText[step.key] || "";
          h+='<div class="other-wrap">'
            +'<div class="other-label"><div class="other-check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>'+T([opt[0],opt[1]])+'</div>'
            +'<input class="other-input" id="otherInput" maxlength="25" placeholder="'+(S.lang?"พิมพ์คำตอบที่นี่...":"Type your answer here...")+'" value="'+curVal.replace(/"/g,"&quot;")+'" oninput="document.getElementById(\'otherCount\').textContent=this.value.length+\'/25\';S.otherText[\''+step.key+'\']=this.value;">'
            +'<div class="other-count" id="otherCount">'+curVal.length+'/25</div>'
            +'</div>';
        }else{
          h+='<button class="opt'+(isSel?' selected':'')+'" onclick="selectOption('+i+')">'+T([opt[0],opt[1]])+'</button>';
        }
      }
      h+='<button class="primary'+(sel===undefined?' disabled':'')+'" onclick="confirmNext()" style="margin-top:8px;">'+(S.lang?"ถัดไป":"Next")+' &#8594;</button>';
      h+='</div>';
    }

  }else if(S.ph==="result"){
    var d=D[S.res.key], a=A[S.res.style], imgNum=KEY_TO_IMG[S.res.key];
    var so=AO.slice().sort(function(x,y){return d.s[y]-d.s[x];});
    var bars="";
    for(var j=0;j<so.length;j++){
      var k=so[j], lead=(k===S.res.style);
      bars+='<div class="rbar-row"><span class="rbar-label" style="color:'+(lead?'#fff':'rgba(255,255,255,.5)')+';font-family:'+(lead?"'SCBXB'":"'SCBXR'")+';">'+T(A[k].n)+'</span>'
        +'<div class="rbar-track"><div class="rbar-fill" style="width:'+d.s[k]+'%;background:'+(lead?'linear-gradient(90deg,'+a.bd+','+a.c+')':'rgba(255,255,255,.28)')+';"></div></div>'
        +'<span class="rbar-pct" style="color:'+(lead?'#fff':'rgba(255,255,255,.5)')+';font-family:'+(lead?"'SCBXB'":"'SCBXR'")+';">'+d.s[k]+'%</span></div>';
    }
    h='<div class="screen app">'+chromeHtml(0,0)
      +'<div class="rcard-zoomwrap"><div class="rcard" id="shareCard">'
      +topbarHtml()
      +'<div class="rcharwrap" style="background-image:linear-gradient(180deg,'+a.dk+'00 0%,'+a.dk+'00 57%,'+a.dk+'8C 77%,'+a.dk+'EB 89%,'+a.dk+' 100%),url('+CHAR_IMG[imgNum]+'),linear-gradient(160deg,'+a.bd+','+a.c+');"></div>'
      +'<div class="rbadge" style="color:'+a.dk+';">'+T(C[S.res.conv].n)+'</div>'
      +'<div class="rpanel" style="background:'+a.dk+';">'
      +'<div class="rname">'+T(d.t)+'</div>'
      +'<div class="rtag" style="color:'+a.lt+';">'+T(d.g)+'</div>'
      +'<div class="rbody">'+(S.lang?d.th:d.e)+'</div>'
      +'<div class="rquote">&#8220;'+T(d.k)+'&#8221;</div>'
      +'<div class="rbars">'+bars+'</div>'
      +'<div class="rmeta"><div class="rmeta-box"><p>'+(S.lang?"ขั้วตรงข้าม":"OPPOSITE")+'</p><b>'+d.o+'</b></div>'
      +'<div class="rmeta-box"><p>'+(S.lang?"เข้าขากับ":"PAIRS WITH")+'</p><b>'+d.p+'</b></div></div>'
      +'<div class="rrarity" style="background:linear-gradient(135deg,'+a.bd+','+a.c+');">'+(S.lang?"มีเพียง 1 ใน "+d.r+" คนที่ได้การ์ดใบนี้":"Only 1 in "+d.r+" people get this card")+'</div>'
      +'</div></div></div>'
      +'<div class="btnrow">'
      +'<button class="ghost" onclick="saveCardImage()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'+(S.lang?"บันทึกรูป":"Save image")+'</button>'
      +'<button class="ghost" onclick="shareCardImage()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>'+(S.lang?"แชร์":"Share")+'</button>'
      +'</div>'
      +'<div class="adline"><a href="'+LINE_URL+'" target="_blank" style="color:var(--accent);font-family:\'SCBXB\';text-decoration:underline;">'+(S.lang?"ติดตามความรู้ใหม่ ๆ ได้ง่าย ๆ ผ่าน SCBX R&D LINE":"Stay tech-updated easily via SCBX R&D LINE")+'</a></div>'
      +'<button class="primary" onclick="S.ph=\'act3\';render();">'+(S.lang?"ช่วยปรับคอนเทนต์ให้เหมาะกับคุณ":"Help us tailor the content for you")+'</button>'
      +'</div>';

  }else if(S.ph==="act3"){
    var q=ACT3[S.a3], sel3=S.selectedA3[S.a3];
    h='<div class="screen app">'+chromeHtml(ACT3.length, S.a3)
      +'<div class="qtext">'+T(q.q)+'</div>';
    for(var m=0;m<q.o.length;m++){
      var isSel3=(sel3===m);
      h+='<button class="opt'+(isSel3?' selected':'')+'" onclick="selectOptionA3('+m+')">'+T(q.o[m])+'</button>';
    }
    h+='<button class="primary'+(sel3===undefined?' disabled':'')+'" onclick="confirmNextA3()" style="margin-top:8px;">'+(S.lang?"ถัดไป":"Next")+' &#8594;</button>';
    h+='</div>';

  }else if(S.ph==="done"){
    var d2=D[S.res.key], a2=A[S.res.style], imgNum2=KEY_TO_IMG[S.res.key];
    h='<div class="screen app" style="align-items:center;justify-content:center;text-align:center;">'
      +chromeHtml(0,0)
      +'<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">'
      +'<div style="width:84px;height:84px;border-radius:50%;overflow:hidden;margin:0 auto;"><img src="'+CHAR_IMG[imgNum2]+'" style="width:100%;height:100%;object-fit:cover;object-position:top center;"></div>'
      +'<p style="font-family:\'SCBXB\';font-size:16px;margin:12px 0 4px;">'+(S.lang?"ขอบคุณที่ตอบแบบสอบถาม":"Thank you for taking our survey")+'</p>'
      +'<p style="color:var(--ink-soft);font-size:13px;margin-bottom:20px;">'+(S.lang?"การ์ด "+T(d2.t)+" ของคุณพร้อมแล้ว":"Your "+T(d2.t)+" card is ready.")+'</p>'
      +'<button class="primary" style="margin-bottom:8px;" onclick="S.ph=\'result\';render();">'+(S.lang?"ดูและแชร์การ์ด":"View and share my card")+'</button>'
      +'<button class="secondary" style="margin-bottom:14px;" onclick="restart()">'+(S.lang?"เล่นอีกครั้ง":"Take it again")+'</button>'
      +'<div style="background:#F5F0FA;border:1px solid #E0D4F0;border-radius:12px;padding:16px 12px;text-align:center;width:100%;">'
      +'<p style="font-size:11.3px;color:var(--ink);line-height:1.5;margin-bottom:12px;">'+(S.lang?"ติดตามความเคลื่อนไหวด้านเทคโนโลยีได้ที่ SCBX R&D บน LINE":"Stay tech-updated by adding SCBX R&D on LINE.")+'</p>'
      +'<a href="'+LINE_URL+'" target="_blank" style="display:inline-flex;align-items:center;gap:6px;background:#06C755;color:#fff;font-family:\'SCBXB\';font-size:13px;padding:11px 22px;border-radius:10px;text-decoration:none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 5.94 2 10.8c0 4.34 3.55 7.98 8.35 8.67.33.07.77.22.88.5.1.26.07.66.03.92l-.14.86c-.04.26-.2 1 .87.55 1.08-.46 5.8-3.42 7.92-5.85C21.4 14.3 22 12.62 22 10.8 22 5.94 17.52 2 12 2z"/></svg>'+(S.lang?"เพิ่มเพื่อน LINE":"Add LINE")+'</a>'
      +'</div>'
      +'</div></div>';
  }

  stage.innerHTML = h;
}
render();
</script>
